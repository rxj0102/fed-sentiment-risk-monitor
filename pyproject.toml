description = "Research code for fed-sentiment-risk-monitor"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.39.0",
    "yfinance==0.2.44",
    "pandas==2.2.3",
    "numpy==2.1.2",
    "plotly==5.24.1",
    "matplotlib==3.9.2",
    "fredapi==0.5.2",
    "requests==2.32.3",
    "beautifulsoup4==4.12.3",
    "scikit-learn==1.5.2",
    "scipy==1.14.1",
    "python-dotenv==1.0.1",
    "lxml==5.3.0"
]

[dependency-groups]
dev = ["pytest>=7.4"]

[tool.uv]
package = false

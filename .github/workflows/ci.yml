name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pandas numpy scikit-learn yfinance fredapi python-dotenv beautifulsoup4 lxml requests
      - run: python -m pytest -q
